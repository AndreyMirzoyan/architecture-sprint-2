name: mongo-sharding-repl
services:
  # mongodb1:
  #   container_name: mongodb1
  #   image: dh-mirror.gitverse.ru/mongo:latest
  #   volumes:
  #     - mongodb1_data_container:/data/db

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    networks:
      app-network:
        ipv4_address: 10.0.0.2
    environment:
      MONGODB_URL: "mongodb://mongos_router:27004"
      MONGODB_DATABASE_NAME: "megadb"


  # сервер конфигурации
  configSrv:
    image: mongo:latest # docker образ
    container_name: configSrv 
    restart: always
    ports:
      - "27003:27003"
    networks:
      app-network:
        ipv4_address: 10.0.0.3
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",  # запуск в режиме конфигурации
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27003"
      ] 
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  #роутер
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27004:27004"
    networks:
      app-network:
        ipv4_address: 10.0.0.4
    command:
      [
        "mongos", #обычная mongo в режиме роутера
        "--configdb", 
        "config_server/configSrv:27003", # передача данных сервера конфигурации
        "--bind_ip_all",
        "--port",
        "27004"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s


  #1-й шард, инстанс 1
  shard11:
    image: mongo:latest
    container_name: shard11
    restart: always
    ports:
      - "27011:27011"
    networks:
      app-network:
        ipv4_address: 10.0.0.11
    volumes:
      - shard11-data:/data/db
    command:
      [
        "--shardsvr", #запуск в режиме шардинга
        "--replSet",
        "rs0", #название реплики
        "--bind_ip_all",
        "--port",
        "27011"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  #1-й шард, инстанс 2
  shard12:
    image: mongo:latest
    container_name: shard12
    restart: always
    ports:
      - "27012:27012"
    networks:
      app-network:
        ipv4_address: 10.0.0.12
